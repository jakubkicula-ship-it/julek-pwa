name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [android-source.zip, .github/workflows/android-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract reviewed Android source
        run: unzip -q android-source.zip -d android-source
      - name: Build and test native application
        working-directory: android-source
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Prepare local signing helper (no private keys on runner)
        run: |
          mkdir -p android-artifacts
          cp android-source/app/build/outputs/apk/release/app-release-unsigned.apk android-artifacts/
          curl --fail --location --silent --show-error https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.7.3/apksig-8.7.3.jar -o android-artifacts/apksig-8.7.3.jar
          javac --release 8 -cp android-artifacts/apksig-8.7.3.jar -d android-artifacts android-source/tools/SignApk.java
      - uses: actions/upload-artifact@v4
        with:
          name: zadania-julka-android-unsigned
          path: android-artifacts/
          retention-days: 14
